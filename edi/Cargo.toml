[workspace]
resolver = "2"
members = ["crates/edi-brain", "crates/edi-lang", "crates/edid"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
